<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonlit Grove RPG</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    /* Cosmic Temple Background */
    body { 
      background: #0b0c10 url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed; 
      background-size: cover;
      color: #c5c6c7; 
      margin: 0; 
      padding: 20px; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
    }
    
    .game-card { 
      max-width: 650px; 
      width: 100%; 
      background: rgba(15, 12, 29, 0.85); 
      backdrop-filter: blur(10px);
      border-radius: 16px; 
      border: 1px solid rgba(179, 136, 255, 0.4); 
      padding: 25px; 
      box-shadow: 0 0 30px rgba(156, 39, 176, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.05); 
    }
    
    .stats-bar { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 10px; 
      background: rgba(11, 12, 16, 0.8); 
      padding: 12px 18px; 
      border-radius: 10px; 
      border: 1px solid rgba(179, 136, 255, 0.3); 
      margin-bottom: 20px; 
      font-weight: 600; 
      font-size: 0.95rem; 
    }
    .stat-item { display: flex; align-items: center; gap: 6px; }
    .stat-value { color: #d1c4e9; }
    
    .timer-box { 
      grid-column: span 2; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: rgba(42, 26, 66, 0.6); 
      padding: 8px 12px; 
      border-radius: 8px; 
      border: 1px solid #b388ff; 
      margin-top: 5px; 
    }
    .gem-btn { 
      background: #7c4dff; 
      color: #fff; 
      border: none; 
      padding: 6px 12px; 
      border-radius: 6px; 
      font-weight: bold; 
      cursor: pointer; 
      transition: 0.2s; 
    }
    .gem-btn:hover:not(:disabled) { background: #651fff; transform: scale(1.03); }
    .gem-btn:disabled { background: #333; color: #777; cursor: not-allowed; }

    .audio-btn { 
      background: rgba(31, 40, 51, 0.8); 
      color: #b388ff; 
      border: 1px solid #b388ff; 
      padding: 4px 8px; 
      border-radius: 6px; 
      cursor: pointer; 
    }

    .character-box { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      background: rgba(11, 12, 16, 0.8); 
      padding: 12px; 
      border-radius: 10px; 
      margin-bottom: 15px; 
      border-left: 4px solid #b388ff; 
    }
    .avatar { 
      width: 45px; 
      height: 45px; 
      background: #7c4dff; 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 1.4rem; 
    }
    .char-info h3 { margin: 0; color: #d1c4e9; font-size: 1.1rem; }
    .char-info p { margin: 2px 0 0 0; color: #9fa8da; font-size: 0.85rem; }

    .story-text { line-height: 1.6; font-size: 1rem; color: #f3e5f5; margin-bottom: 25px; min-height: 60px; }

    .choices-container { display: flex; flex-direction: column; gap: 12px; }
    .choice-btn { 
      background: rgba(18, 11, 36, 0.85); 
      color: #e1bee7; 
      border: 1px solid rgba(179, 136, 255, 0.4); 
      padding: 14px 18px; 
      border-radius: 10px; 
      text-align: left; 
      cursor: pointer; 
      font-size: 0.95rem; 
      font-weight: 500; 
      transition: all 0.2s ease; 
    }
    .choice-btn:hover { 
      background: #7c4dff; 
      color: #fff; 
      border-color: #b388ff; 
      transform: translateY(-2px); 
      box-shadow: 0 4px 12px rgba(124, 77, 255, 0.4); 
    }
  </style>
</head>
<body>

<div class="game-card">
  <!-- Top Stats Bar -->
  <div class="stats-bar">
    <div class="stat-item">✨ Mana: <span class="stat-value" id="manaVal">100</span></div>
    <div class="stat-item">💎 Gems: <span class="stat-value" id="gemsVal">0</span></div>
    <div class="stat-item">📜 Artifact: <span class="stat-value" id="artifactVal">None</span></div>
    <button class="audio-btn" id="musicBtn">🎵 Music: OFF</button>
    
    <!-- Free Gems Timer System -->
    <div class="timer-box">
      <span>⏳ Free Gems in: <strong id="timerVal" style="color:#b388ff;">5s</strong></span>
      <button class="gem-btn" id="claimGemsBtn" disabled>🎁 Claim +10 Gems</button>
    </div>
  </div>

  <!-- Speaker Header -->
  <div class="character-box">
    <div class="avatar" id="avatarIcon">🔮</div>
    <div class="char-info">
      <h3 id="speakerName">High Priestess Lyra</h3>
      <p id="speakerTitle">Guardian of the Astral Plane</p>
    </div>
  </div>

  <!-- Story Text -->
  <div class="story-text" id="storyText">Loading game...</div>

  <!-- Action Choices -->
  <div class="choices-container" id="choicesBox"></div>
</div>

<audio id="bgMusic" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=fantasy-medieval-112992.mp3"></audio>

<script>
  // Game State
  const gameState = {
    mana: 100,
    gems: 0,
    artifact: 'Starlight Scroll',
    currentScene: 'start'
  };

  // Timer Variables
  let gemTimer = 5;
  const claimBtn = document.getElementById('claimGemsBtn');
  const timerDisplay = document.getElementById('timerVal');

  // Gem Countdown Loop
  setInterval(() => {
    if (gemTimer > 0) {
      gemTimer--;
      timerDisplay.textContent = `${gemTimer}s`;
    } else {
      timerDisplay.textContent = "READY!";
      claimBtn.disabled = false;
    }
  }, 1000);

  // Claim Gems Button Handler
  claimBtn.addEventListener('click', () => {
    gameState.gems += 10;
    gemTimer = 5;
    claimBtn.disabled = true;
    timerDisplay.textContent = `${gemTimer}s`;
    updateUI();
    renderScene(gameState.currentScene); // Refresh dynamic shop choices
  });

  // Audio Handler
  const music = document.getElementById('bgMusic');
  const musicBtn = document.getElementById('musicBtn');
  let isPlaying = false;

  musicBtn.addEventListener('click', () => {
    if (isPlaying) {
      music.pause();
      musicBtn.textContent = '🎵 Music: OFF';
    } else {
      music.play();
      musicBtn.textContent = '⏸️ Music: ON';
    }
    isPlaying = !isPlaying;
  });

  // Story Nodes
  const story = {
    start: {
      speaker: "High Priestess Lyra",
      title: "Guardian of the Astral Plane",
      avatar: "🔮",
      text: "High Priestess Lyra summons you into the Moonlit Grove. 'Dark shadow magic has corrupted the World Tree. Take this Starlight Scroll and enter the forest.'",
      onEnter: () => {
        gameState.artifact = 'Starlight Scroll';
      },
      choices: [
        { text: "🌲 Follow the Glowing Mushroom Path into the woods", target: "forest" },
        { text: "⛰️ Climb the Mist Mountains to speak with the Alchemist", target: "alchemist" }
      ]
    },
    alchemist: {
      speaker: "Master Ignis",
      title: "Potion Master",
      avatar: "🧪",
      text: "In his mountain hut, Master Ignis stirs a cauldron. 'I can forge you a Phoenix Tear, but it costs 30 Gems—or I will trade it for your Starlight Scroll.'",
      choices: () => {
        const options = [];
        
        // Unlocks option when player reaches 30 Gems
        if (gameState.gems >= 30) {
          options.push({ text: "💎 Buy Phoenix Tear (Costs 30 Gems)", target: "buySuccess" });
        }
        
        // Dynamic trade option
        if (gameState.artifact === 'Starlight Scroll') {
          options.push({ text: "🔄 Trade Starlight Scroll for Phoenix Tear", target: "tradeSuccess" });
        }
        
        options.push({ text: "🏃 Leave the hut and dive into the Moonlit Grove", target: "forest" });
        return options;
      }
    },
    buySuccess: {
      speaker: "Master Ignis",
      title: "Potion Master",
      avatar: "🧪",
      text: "'Here is your Phoenix Tear! Thank you for the 30 Gems!'",
      onEnter: () => {
        gameState.gems -= 30;
        gameState.artifact = 'Phoenix Tear';
      },
      choices: [
        { text: "🌲 Enter the Moonlit Grove woods", target: "forest" }
      ]
    },
    tradeSuccess: {
      speaker: "Master Ignis",
      title: "Potion Master",
      avatar: "🧪",
      text: "'A fine trade!' Ignis hands you a glowing red vial containing the Phoenix Tear.",
      onEnter: () => {
        gameState.artifact = 'Phoenix Tear';
      },
      choices: [
        { text: "🌲 Enter the Moonlit Grove woods", target: "forest" }
      ]
    },
    forest: {
      speaker: "Sylph the Fairy",
      title: "Forest Sprite",
      avatar: "🧚",
      text: "A glowing fairy named Sylph flits around your head. 'A shadow beast guards the ancient bridge ahead! How will you cross?'",
      choices: () => {
        const options = [];
        if (gameState.artifact === 'Phoenix Tear') {
          options.push({ text: "🔥 Use Phoenix Tear to purify the Shadow Beast", target: "win" });
        }
        options.push({ text: "⚔️ Attempt to fight the shadow beast with magic bolts", target: "die" });
        return options;
      }
    },
    die: {
      speaker: "Narrator",
      title: "Defeat",
      avatar: "💀",
      text: "Your magic bolts bounce harmlessly off the shadow beast's dark armor. You have fallen...",
      choices: [
        { text: "🔄 Restart Game", target: "start" }
      ]
    },
    win: {
      speaker: "High Priestess Lyra",
      title: "Guardian of the Astral Plane",
      avatar: "✨",
      text: "The Phoenix Tear blazes with pure holy fire, purifying the shadow beast and curing the World Tree! You win!",
      choices: [
        { text: "🏆 Play Again", target: "start" }
      ]
    }
  };

  function updateUI() {
    document.getElementById('manaVal').textContent = gameState.mana;
    document.getElementById('gemsVal').textContent = gameState.gems;
    document.getElementById('artifactVal').textContent = gameState.artifact;
  }

  function renderScene(sceneKey) {
    gameState.currentScene = sceneKey;
    const scene = story[sceneKey];
    if (scene.onEnter) scene.onEnter();
    updateUI();

    document.getElementById('speakerName').textContent = scene.speaker;
    document.getElementById('speakerTitle').textContent = scene.title;
    document.getElementById('avatarIcon').textContent = scene.avatar;
    document.getElementById('storyText').textContent = scene.text;

    const choicesBox = document.getElementById('choicesBox');
    choicesBox.innerHTML = '';

    const currentChoices = typeof scene.choices === 'function' ? scene.choices() : scene.choices;

    currentChoices.forEach(choice => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = choice.text;
      btn.onclick = () => renderScene(choice.target);
      choicesBox.appendChild(btn);
    });
  }

  // Initial Launch
  renderScene('start');
</script>
</body>
</html>
