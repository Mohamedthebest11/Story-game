<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Crystal Sanctuary - Magic Adventure</title>
  
  <style>
    :root {
      --bg: #090e17;
      --glow: rgba(147, 51, 234, 0.3);
      --card: #131b2e;
      --accent: #a855f7;
      --text: #f3f4f6;
      --sub: #9ca3af;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Georgia', serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
      transition: background 0.8s ease;
    }

    .game-card {
      background: var(--card);
      border: 2px solid #2e1065;
      border-radius: 18px;
      padding: 2rem;
      width: 100%;
      max-width: 580px;
      box-shadow: 0 0 35px var(--glow);
      transition: box-shadow 0.8s ease;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .stats-bar {
      display: flex;
      gap: 15px;
      background: #060911;
      padding: 8px 15px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.9rem;
      border: 1px solid #2e1065;
      flex-grow: 1;
    }

    .stat {
      color: var(--accent);
    }

    .music-btn {
      background: #2e1065;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      margin-left: 10px;
    }

    .character-box {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #060911;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 1.2rem;
      border: 1px solid #2e1065;
    }

    .avatar-frame {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #131b2e;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.2rem;
      border: 2px solid var(--accent);
      flex-shrink: 0;
    }

    .character-info h4 {
      margin: 0 0 4px 0;
      color: var(--accent);
      font-size: 1.1rem;
    }

    .character-info p {
      margin: 0;
      font-size: 0.85rem;
      color: var(--sub);
    }

    .story-text {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #e5e7eb;
      margin-bottom: 1.5rem;
      min-height: 90px;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice-btn {
      background: #1e1b4b;
      color: var(--text);
      border: 1px solid var(--accent);
      padding: 12px 16px;
      border-radius: 8px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
      font-weight: 500;
    }

    .choice-btn:hover {
      background: var(--accent);
      color: #090e17;
      font-weight: bold;
    }

    .btn-reset {
      background: var(--danger);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      width: 100%;
      margin-top: 15px;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>

  <div class="game-card" id="gameCard">
    <!-- STATS AND MUSIC TOGGLE -->
    <div class="header-bar">
      <div class="stats-bar">
        <div>✨ Mana: <span id="hp" class="stat">100</span></div>
        <div>🪙 Gems: <span id="gold" class="stat">0</span></div>
        <div>📜 Artifact: <span id="item" class="stat">None</span></div>
      </div>
      <button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵 Music: OFF</button>
    </div>

    <!-- CHARACTER CONTAINER -->
    <div class="character-box">
      <div id="characterAvatar" class="avatar-frame">🧙‍♀️</div>
      <div class="character-info">
        <h4 id="characterName">High Priestess Lyra</h4>
        <p id="characterRole">Guardian of the Astral Plane</p>
      </div>
    </div>

    <!-- MAIN STORY DISPLAY -->
    <div id="storyText" class="story-text">Chanting ancient incantations...</div>
    
    <!-- CHOICE BUTTONS -->
    <div id="choicesContainer" class="choices"></div>
    
    <!-- RESET BUTTON -->
    <button id="resetBtn" class="btn-reset" onclick="startGame()">🔄 Begin Quest Again</button>
  </div>

  <script>
    // AUDIO SYNTHESIZER (SYNTH MUSIC & SFX)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    let isMusicPlaying = false;
    let musicInterval;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playSound(type) {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); // C5 note
        osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.08); // C6 note
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.linearRampToValueAtTime(30, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'heal') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.linearRampToValueAtTime(880, now + 0.3);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    }

    // Mystical Ambience Loop
    function toggleMusic() {
      initAudio();
      const btn = document.getElementById('musicBtn');

      if (isMusicPlaying) {
        clearInterval(musicInterval);
        isMusicPlaying = false;
        btn.textContent = "🎵 Music: OFF";
      } else {
        isMusicPlaying = true;
        btn.textContent = "🎵 Music: ON";
        let step = 0;
        const notes = [174.61, 220.00, 261.63, 329.63]; // F, A, C, E magic scale

        musicInterval = setInterval(() => {
          if (!isMusicPlaying) return;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.6);
          step++;
        }, 600);
      }
    }

    let gameState = {};

    const storyData = {
      // --- ACT 1: ENCHANTED FOREST ---
      start: {
        bg: "#090e17",
        glow: "rgba(147, 51, 234, 0.3)",
        character: { name: "High Priestess Lyra", role: "Guardian of the Astral Plane", avatar: "🧙‍♀️" },
        text: "High Priestess Lyra summons you into the Moonlit Grove. 'Dark shadow magic has corrupted the World Tree. Take this Starlight Scroll and enter the forest.'",
        choices: [
          { 
            text: "🌲 Follow the Glowing Mushroom Path into the woods", 
            next: "grove", 
            sound: "click",
            action: () => { gameState.item = "Starlight Scroll"; } 
          },
          { 
            text: "⛰️ Climb the Mist Mountains to speak with the Alchemist", 
            next: "alchemist" 
          }
        ]
      },
      alchemist: {
        bg: "#160b1e",
        glow: "rgba(217, 70, 239, 0.3)",
        character: { name: "Master Ignis", role: "Potion Master", avatar: "🧪" },
        text: "In his mountain hut, Master Ignis stirs a cauldron. 'I can forge you a Phoenix Tear, but it costs 30 Gems—or I will trade it for your Starlight Scroll.'",
        choices: [
          { 
            text: "📜 Trade Starlight Scroll for Phoenix Tear", 
            next: "tradeTear", 
            sound: "click",
            condition: () => gameState.item === "Starlight Scroll" 
          },
          { 
            text: "🪙 Buy Phoenix Tear for 30 Gems", 
            next: "buyTear", 
            sound: "click",
            condition: () => gameState.gold >= 30 
          },
          { 
            text: "🏃 Leave the hut and dive into the Moonlit Grove", 
            next: "grove", 
            sound: "click" 
          }
        ]
      },
      tradeTear: {
        bg: "#160b1e",
        glow: "rgba(217, 70, 239, 0.3)",
        character: { name: "Master Ignis", role: "Potion Master", avatar: "🧪" },
        text: "Ignis smiles warmly, taking the scroll. 'A fair exchange! Take this glowing bottle and 20 extra Mana Gems.'",
        choices: [
          { text: "🌲 Enter the Deep Woods", next: "grove", sound: "click" }
        ],
        action: () => {
          gameState.gold += 20;
          gameState.item = "Phoenix Tear";
        }
      },
      grove: {
        bg: "#041710",
        glow: "rgba(16, 185, 129, 0.3)",
        character: { name: "Sylph the Fairy", role: "Forest Sprite", avatar: "🧚" },
        text: "A glowing fairy named Sylph flits around your head. 'A shadow beast guards the ancient bridge ahead! How will you cross?'",
        choices: [
          { 
            text: "📜 Read the Starlight Scroll to blind the beast with holy light", 
            next: "beastScrollWin", 
            sound: "heal",
            condition: () => gameState.item === "Starlight Scroll" 
          },
          { 
            text: "🧪 Splash the Phoenix Tear to burn away the shadow", 
            next: "beastTearWin", 
            sound: "heal",
            condition: () => gameState.item === "Phoenix Tear" 
          },
          { 
            text: "⚔️ Attempt to fight the shadow beast with magic bolts", 
            next: "beastFight", 
            sound: "hit" 
          }
        ]
      },
      beastScrollWin: {
        bg: "#041710",
        glow: "rgba(16, 185, 129, 0.4)",
        character: { name: "Sylph the Fairy", role: "Forest Sprite", avatar: "✨" },
        text: "The Starlight Scroll shines like a miniature sun! The shadow beast vanishes into mist, leaving behind 50 Mana Gems.",
        choices: [
          { text: "🏰 Enter the World Tree Gate", next: "sanctuaryGate", sound: "click" }
        ],
        action: () => {
          gameState.gold += 50;
        }
      },
      beastTearWin: {
        bg: "#041710",
        glow: "rgba(16, 185, 129, 0.4)",
        character: { name: "Sylph the Fairy", role: "Forest Sprite", avatar: "✨" },
        text: "The Phoenix Tear erupts in golden flames! The corruption melts away and your Mana is completely restored.",
        choices: [
          { text: "🏰 Enter the World Tree Gate", next: "sanctuaryGate", sound: "click" }
        ],
        action: () => {
          gameState.hp = 100;
        }
      },
      beastFight: {
        bg: "#1c0909",
        glow: "rgba(220, 38, 38, 0.3)",
        character: { name: "Shadow Wraith", role: "Corrupted Demon", avatar: "👾" },
        text: "The wraith strikes you with dark magic, draining your vitality! You barely blast past it into the sanctuary.",
        choices: [
          { text: "🤕 Stumble into the Sanctuary Gate", next: "sanctuaryGate", sound: "click" }
        ],
        action: () => {
          gameState.hp -= 40;
        }
      },

      // --- ACT 2: WORLD TREE SANCTUARY ---
      sanctuaryGate: {
        bg: "#180c2e",
        glow: "rgba(168, 85, 247, 0.4)",
        character: { name: "Malakor the Void Sorcerer", role: "Master of Shadows", avatar: "🧙‍♂️" },
        text: "At the heart of the World Tree stands Malakor! He weaves black fire around the tree's crystal core. 'You are too late to stop the ritual!'",
        choices: [
          { 
            text: "📜 Cast the Starlight Scroll to cleanse the tree's core", 
            next: "winScroll", 
            sound: "heal",
            condition: () => gameState.item === "Starlight Scroll" 
          },
          { 
            text: "🧪 Pour the Phoenix Tear onto Malakor's shadow spell", 
            next: "winTear", 
            sound: "heal",
            condition: () => gameState.item === "Phoenix Tear" 
          },
          { 
            text: "🪄 Engage Malakor in a direct magic duel", 
            next: "magicDeath", 
            sound: "hit" 
          }
        ]
      },
      magicDeath: {
        bg: "#1a0404",
        glow: "rgba(220, 38, 38, 0.5)",
        character: { name: "Malakor the Void Sorcerer", role: "Master of Shadows", avatar: "💀" },
        text: "Malakor's void spells overwhelm your barrier. Dark magic consumes the realm...",
        choices: [],
        action: () => {
          gameState.hp = 0;
        }
      },

      // --- ENDINGS ---
      winScroll: {
        bg: "#0a1f18",
        glow: "rgba(16, 185, 129, 0.6)",
        character: { name: "High Priestess Lyra", role: "Guardian of the Astral Plane", avatar: "👑" },
        text: "🎉 The holy light from your scroll purifies the World Tree! Malakor fades away and the magic realm is saved! YOU WIN!",
        choices: []
      },
      winTear: {
        bg: "#0a1f18",
        glow: "rgba(217, 70, 239, 0.6)",
        character: { name: "High Priestess Lyra", role: "Guardian of the Astral Plane", avatar: "👑" },
        text: "🎉 The Phoenix Tear explodes into divine fire, destroying the corruption instantly! You are hailed as the Great Archmage! YOU WIN!",
        choices: []
      }
    };

    function updateStats() {
      document.getElementById('hp').textContent = gameState.hp;
      document.getElementById('gold').textContent = gameState.gold;
      document.getElementById('item').textContent = gameState.item;
    }

    function showScene(key) {
      const scene = storyData[key];
      if (!scene) return;

      if (scene.action) scene.action();
      updateStats();

      // Update background and glow
      if (scene.bg) document.body.style.background = scene.bg;
      if (scene.glow) document.getElementById('gameCard').style.setProperty('--glow', scene.glow);

      // Update character profile
      if (scene.character) {
        document.getElementById('characterName').textContent = scene.character.name;
        document.getElementById('characterRole').textContent = scene.character.role;
        document.getElementById('characterAvatar').textContent = scene.character.avatar;
      }

      // Check for Game Over
      if (gameState.hp <= 0) {
        gameState.hp = 0;
        updateStats();
        playSound('hit');
        document.getElementById('storyText').textContent = "☠️ MANA EXHAUSTED! The dark magic claims your soul.";
        document.getElementById('choicesContainer').innerHTML = "";
        document.getElementById('resetBtn').style.display = "block";
        return;
      }

      document.getElementById('storyText').textContent = scene.text;
      const container = document.getElementById('choicesContainer');
      container.innerHTML = "";

      if (scene.choices.length === 0) {
        document.getElementById('resetBtn').style.display = "block";
        return;
      }

      scene.choices.forEach(c => {
        if (c.condition && !c.condition()) return;
        
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = c.text;
        btn.onclick = () => {
          if (c.sound) playSound(c.sound);
          showScene(c.next);
        };
        container.appendChild(btn);
      });
    }

    function startGame() {
      gameState = { hp: 100, gold: 0, item: "None" };
      document.getElementById('resetBtn').style.display = "none";
      showScene('start');
    }

    // Launch game on page load
    startGame();
  </script>
</body>
</html>
