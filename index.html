<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Infiltration - Sci-Fi Adventure</title>
  
  <style>
    :root {
      --bg: #090d16;
      --card: #131c2e;
      --accent: #00f0ff;
      --text: #f3f4f6;
      --sub: #8b9bb4;
      --danger: #ff2a6d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .game-card {
      background: var(--card);
      border: 2px solid #1e2d4a;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 550px;
      box-shadow: 0 10px 30px rgba(0, 240, 255, 0.15);
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      background: #0a111e;
      padding: 10px 15px;
      border-radius: 10px;
      font-weight: bold;
      margin-bottom: 1.2rem;
      font-size: 0.95rem;
      border: 1px solid #1a273e;
    }

    .stat {
      color: var(--accent);
    }

    .character-box {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #0a111e;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 1.2rem;
      border: 1px solid #1a273e;
    }

    .avatar-frame {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #131c2e;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.2rem;
      border: 2px solid var(--accent);
      flex-shrink: 0;
    }

    .character-info h4 {
      margin: 0 0 4px 0;
      color: var(--accent);
      font-size: 1.1rem;
    }

    .character-info p {
      margin: 0;
      font-size: 0.85rem;
      color: var(--sub);
    }

    .story-text {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #e5e7eb;
      margin-bottom: 1.5rem;
      min-height: 80px;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice-btn {
      background: #18253d;
      color: var(--text);
      border: 1px solid var(--accent);
      padding: 12px 16px;
      border-radius: 8px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
      font-weight: 500;
    }

    .choice-btn:hover {
      background: var(--accent);
      color: #090d16;
      font-weight: bold;
    }

    .btn-reset {
      background: var(--danger);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      width: 100%;
      margin-top: 15px;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <!-- PLAYER STATS HEADER -->
    <div class="stats-bar">
      <div>🔋 Shield: <span id="hp" class="stat">100</span></div>
      <div>💾 Data: <span id="gold" class="stat">0</span></div>
      <div>🔧 Tool: <span id="item" class="stat">None</span></div>
    </div>

    <!-- CHARACTER DISPLAY AREA -->
    <div class="character-box">
      <div id="characterAvatar" class="avatar-frame">🤖</div>
      <div class="character-info">
        <h4 id="characterName">KEX-7</h4>
        <p id="characterRole">AI Operator</p>
      </div>
    </div>

    <!-- MAIN STORY CONTENT -->
    <div id="storyText" class="story-text">Loading simulation...</div>
    
    <!-- CHOICE BUTTONS -->
    <div id="choicesContainer" class="choices"></div>
    
    <!-- RESTART BUTTON -->
    <button id="resetBtn" class="btn-reset" onclick="startGame()">🔄 Reboot Mission</button>
  </div>

  <script>
    // SOUND EFFECTS SYNTHESIZER (Web Audio API)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function playSound(type) {
      if (!audioCtx) audioCtx = new AudioCtx();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'click') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.05);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.linearRampToValueAtTime(30, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'heal') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.2);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554.37, now + 0.12);
        osc.frequency.setValueAtTime(659.25, now + 0.24);
        osc.frequency.setValueAtTime(880, now + 0.36);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
      }
    }

    let gameState = {};

    const storyData = {
      start: {
        character: { name: "KEX-7", role: "AI Operator", avatar: "🤖" },
        text: "You drop onto the rooftop of NovaTech Spire. KEX-7 pings your HUD: 'Agent, we need that master code from the central vault. Pick an entry route.'",
        choices: [
          { 
            text: "🔌 Hack the rooftop maintenance terminal", 
            next: "terminal", 
            sound: "click",
            action: () => { gameState.item = "Security Cipher"; } 
          },
          { 
            text: "🪟 Drop down the glass elevator shaft", 
            next: "shaft",
            sound: "click"
          }
        ]
      },
      terminal: {
        character: { name: "Viper", role: "Rival Hacker", avatar: "🕶️" },
        text: "You bypass the security grid, but Viper intercept-hacks your connection! She demands 50 Credits worth of data to let you through.",
        choices: [
          { 
            text: "💻 Counter-hack her system with your Cipher", 
            next: "hackFight", 
            sound: "hit",
            condition: () => gameState.item === "Security Cipher" 
          },
          { 
            text: "🏃 Abort hack and retreat to rooftop", 
            next: "start",
            sound: "click"
          },
          { 
            text: "⚡ Force bypass her firewall", 
            next: "shockTrap", 
            sound: "hit"
          }
        ]
      },
      hackFight: {
        character: { name: "KEX-7", role: "AI Operator", avatar: "🤖" },
        text: "Your Cipher destroys Viper's connection! You siphon 50 Data fragments from her network and unlock the floor level access.",
        choices: [
          { text: "🏢 Proceed to the Vault floor", next: "vaultFloor", sound: "click" }
        ],
        action: () => {
          gameState.gold += 50;
          gameState.hp -= 10;
        }
      },
      shockTrap: {
        character: { name: "Viper", role: "Rival Hacker", avatar: "🕶️" },
        text: "Viper triggers an electrical feedback pulse! Your shield takes heavy damage before you escape her trap.",
        choices: [
          { text: "🤕 Stumble into the elevator shaft", next: "shaft", sound: "click" }
        ],
        action: () => {
          gameState.hp -= 45;
        }
      },
      shaft: {
        character: { name: "NEXUS Tech", role: "Repair Bot", avatar: "🔧" },
        text: "You slide down into a service bay where a friendly NEXUS repair bot offers shield calibration.",
        choices: [
          { text: "⚡ Recharge shield at station", next: "recharge", sound: "heal" },
          { text: "🚪 Bypass station toward Vault floor", next: "vaultFloor", sound: "click" }
        ]
      },
      recharge: {
        character: { name: "NEXUS Tech", role: "Repair Bot", avatar: "🔧" },
        text: "The station restores your shield to 100% and prints an Overdrive Pass for your HUD!",
        choices: [
          { 
            text: "💳 Take Overdrive Pass & head to Vault", 
            next: "vaultFloor", 
            sound: "click",
            action: () => { gameState.item = "Overdrive Pass"; } 
          }
        ],
        action: () => {
          gameState.hp = 100;
        }
      },
      vaultFloor: {
        character: { name: "Titan Drone", role: "Vault Sentinel", avatar: "🛰️" },
        text: "You reach the Central Core. A massive Titan Sentinel Drone blocks the main vault door with blast shields raised.",
        choices: [
          { 
            text: "💳 Swipe Overdrive Pass to override drone", 
            next: "win", 
            sound: "win",
            condition: () => gameState.item === "Overdrive Pass" 
          },
          { 
            text: "💻 Use Security Cipher to shut down drone", 
            next: "cipherWin", 
            sound: "win",
            condition: () => gameState.item === "Security Cipher" 
          },
          { 
            text: "💥 Sprint straight past the drone lasers", 
            next: "laserDeath",
            sound: "hit"
          }
        ]
      },
      laserDeath: {
        character: { name: "Titan Drone", role: "Vault Sentinel", avatar: "💥" },
        text: "The Titan Drone targets your signature and unleashes a plasma barrage. Shield offline!",
        choices: [],
        action: () => {
          gameState.hp = 0;
        }
      },
      cipherWin: {
        character: { name: "KEX-7", role: "AI Operator", avatar: "🤖" },
        text: "🎉 You inject the Cipher into the drone's core, locking the vault open! You download the master payload. MISSION COMPLETE!",
        choices: []
      },
      win: {
        character: { name: "KEX-7", role: "AI Operator", avatar: "👑" },
        text: "🎉 The Overdrive Pass grants full root access! You secure the vault data and extract clean. YOU WIN!",
        choices: []
      }
    };

    function updateStats() {
      document.getElementById('hp').textContent = gameState.hp;
      document.getElementById('gold').textContent = gameState.gold;
      document.getElementById('item').textContent = gameState.item;
    }

    function showScene(key) {
      const scene = storyData[key];
      if (!scene) return;

      if (scene.action) scene.action();
      updateStats();

      // Update Character Card
      if (scene.character) {
        document.getElementById('characterName').textContent = scene.character.name;
        document.getElementById('characterRole').textContent = scene.character.role;
        document.getElementById('characterAvatar').textContent = scene.character.avatar;
      }

      // Check for Game Over
      if (gameState.hp <= 0) {
        gameState.hp = 0;
        updateStats();
        playSound('hit');
        document.getElementById('storyText').textContent = "☠️ CRITICAL FAILURE! System compromised.";
        document.getElementById('choicesContainer').innerHTML = "";
        document.getElementById('resetBtn').style.display = "block";
        return;
      }

      document.getElementById('storyText').textContent = scene.text;
      const container = document.getElementById('choicesContainer');
      container.innerHTML = "";

      if (scene.choices.length === 0) {
        document.getElementById('resetBtn').style.display = "block";
        return;
      }

      scene.choices.forEach(c => {
        if (c.condition && !c.condition()) return;
        
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = c.text;
        btn.onclick = () => {
          if (c.sound) playSound(c.sound);
          showScene(c.next);
        };
        container.appendChild(btn);
      });
    }

      gameState = { hp: 100, gold: 0, item: "None" };
      document.getElementById('resetBtn').style.displa
